<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rouge &amp; Rosa | Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= ÁREA PÚBLICA: AUTENTICAÇÃO ================= -->
  <main id="auth-view" class="auth" hidden>
    <aside class="showcase" aria-hidden="true">
      <p class="brand">Rouge &amp; Rosa</p>
      <div class="shades">
        <span style="--c:#D6446B"></span>
        <span style="--c:#B5304F"></span>
        <span style="--c:#E58E8A"></span>
        <span style="--c:#8E2F4B"></span>
        <span style="--c:#F2B8A9"></span>
        <span style="--c:#5E1F3A"></span>
      </div>
      <p class="showcase-text">Sua cor, do seu jeito.<br>Entre para ver ofertas e acompanhar seus pedidos.</p>
    </aside>

    <section class="panel">
      <p class="brand brand-mobile">Rouge &amp; Rosa</p>

      <!-- Abas -->
      <div class="tabs" role="tablist">
        <button class="tab is-active" role="tab" id="tab-login" aria-selected="true" data-target="form-login">Entrar</button>
        <button class="tab" role="tab" id="tab-signup" aria-selected="false" data-target="form-signup">Criar conta</button>
      </div>

      <div id="message" class="message" role="alert" aria-live="polite" hidden></div>

      <!-- LOGIN -->
      <form id="form-login" class="form" novalidate>
        <h1>Que bom te ver de novo</h1>
        <label for="login-email">E-mail</label>
        <input id="login-email" type="email" autocomplete="email" placeholder="voce@email.com" required>

        <label for="login-password">Senha</label>
        <div class="password-wrap">
          <input id="login-password" type="password" autocomplete="current-password" placeholder="Sua senha" required>
          <button type="button" class="toggle-pass" data-for="login-password" aria-label="Mostrar senha">Mostrar</button>
        </div>

        <button type="button" class="link" id="go-forgot">Esqueci minha senha</button>
        <button type="submit" class="btn">Entrar</button>
      </form>

      <!-- CADASTRO -->
      <form id="form-signup" class="form" novalidate hidden>
        <h1>Crie sua conta</h1>
        <label for="signup-name">Nome</label>
        <input id="signup-name" type="text" autocomplete="name" placeholder="Como podemos te chamar?" required>

        <label for="signup-email">E-mail</label>
        <input id="signup-email" type="email" autocomplete="email" placeholder="voce@email.com" required>

        <label for="signup-password">Senha</label>
        <div class="password-wrap">
          <input id="signup-password" type="password" autocomplete="new-password" placeholder="Mínimo de 6 caracteres" minlength="6" required>
          <button type="button" class="toggle-pass" data-for="signup-password" aria-label="Mostrar senha">Mostrar</button>
        </div>

        <label for="signup-confirm">Confirmar senha</label>
        <input id="signup-confirm" type="password" autocomplete="new-password" placeholder="Repita a senha" required>

        <button type="submit" class="btn">Criar conta</button>
      </form>

      <!-- RECUPERAR SENHA -->
      <form id="form-forgot" class="form" novalidate hidden>
        <h1>Recuperar senha</h1>
        <p class="hint">Informe seu e-mail e enviaremos um link para criar uma nova senha.</p>
        <label for="forgot-email">E-mail</label>
        <input id="forgot-email" type="email" autocomplete="email" placeholder="voce@email.com" required>
        <button type="submit" class="btn">Enviar link</button>
        <button type="button" class="link" id="back-login">Voltar para o login</button>
      </form>

      <!-- NOVA SENHA (após clicar no link do e-mail) -->
      <form id="form-reset" class="form" novalidate hidden>
        <h1>Criar nova senha</h1>
        <label for="reset-password">Nova senha</label>
        <input id="reset-password" type="password" autocomplete="new-password" placeholder="Mínimo de 6 caracteres" minlength="6" required>
        <button type="submit" class="btn">Salvar nova senha</button>
      </form>
    </section>
  </main>

  <!-- ================= ÁREA RESTRITA ================= -->
  <!-- O conteúdo só é montado pelo script.js se existir uma sessão ativa. -->
  <div id="app-view" hidden></div>

  <div id="loading" class="loading">Carregando…</div>

  <template id="app-template">
    <header class="topbar">
      <p class="brand">Rouge &amp; Rosa</p>
      <div class="topbar-user">
        <span id="user-email"></span>
        <button id="btn-logout" class="btn btn-small">Sair</button>
      </div>
    </header>

    <main class="area">
      <section class="welcome">
        <h1 id="welcome-title"></h1>
        <p>Você está na área exclusiva para clientes. Aqui ficam suas ofertas e o resumo da sua conta.</p>
      </section>

      <section class="coupon">
        <div>
          <h2>10% off na primeira compra</h2>
          <p>Use o cupom na finalização do pedido.</p>
        </div>
        <code>ROSA10</code>
      </section>

      <section>
        <h2>Em destaque para você</h2>
        <ul class="products">
          <li><span class="swatch" style="--c:#D6446B"></span><div><strong>Batom Cremoso Rouge 21</strong><small>R$ 49,90</small></div></li>
          <li><span class="swatch" style="--c:#E58E8A"></span><div><strong>Blush em Pó Pétala</strong><small>R$ 59,90</small></div></li>
          <li><span class="swatch" style="--c:#8E2F4B"></span><div><strong>Gloss Labial Amora</strong><small>R$ 34,90</small></div></li>
          <li><span class="swatch" style="--c:#F2B8A9"></span><div><strong>Base Fluida Nude 03</strong><small>R$ 79,90</small></div></li>
        </ul>
      </section>

      <section>
        <h2>Minha conta</h2>
        <dl class="account">
          <dt>Nome</dt><dd id="acc-name"></dd>
          <dt>E-mail</dt><dd id="acc-email"></dd>
          <dt>Cliente desde</dt><dd id="acc-since"></dd>
        </dl>
      </section>
    </main>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="script.js"></script>
</body>
</html>
